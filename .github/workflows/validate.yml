name: Research validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration checks
        run: python -m unittest discover -s tests -v
      - name: Independent acceptance
        run: python -m power_trading_agent benchmark --output runs/acceptance
      - name: Replay and reconcile
        run: |
          python -m power_trading_agent demo --output runs/demo
          python -m power_trading_agent resume --output runs/demo
          python -m power_trading_agent verify --output runs/demo
      - name: Package install and entry point
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          power-trading-agent --version
